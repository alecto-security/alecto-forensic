[package]
name = "alecto-forensic"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "Offline, read-only extraction of video from recorder disk images into a documented package"

[lib]
name = "alecto_forensic"
path = "src/lib.rs"

[[bin]]
name = "alecto-forensic"
path = "src/main.rs"

# No network crates, ever. tests/forensic.rs fails the build if one appears.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
